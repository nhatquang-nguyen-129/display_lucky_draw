name: Electron App Build

on:
  push:
    tags:
      - "v*"

jobs:
  build-electron:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Electron App
        run: npx electron-builder --publish always

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
