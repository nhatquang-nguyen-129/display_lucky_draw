<!--?xml version="1.0" encoding="utf-8"?-->
<svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Create plus icon">
  <g fill="none" fill-rule="evenodd" stroke="none" stroke-width="1">
    <!-- Circular badge (transparent background, white border optional) -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-width="0"></circle>
    <!-- Plus sign -->
    <rect x="232" y="128" width="48" height="256" rx="8" fill="#FFFFFF"></rect>
    <rect x="128" y="232" width="256" height="48" rx="8" fill="#FFFFFF"></rect>
  </g>
</svg>
