<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Rolling Randomizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1 class="title">🎲 QUAY SỐ</h1>

    <!-- SLOT CONTAINER -->
    <div class="slots">

      <!-- Each slot -->
      <div class="slot" id="slot-1">
        <div class="digit-container"></div>
      </div>

      <div class="slot" id="slot-2">
        <div class="digit-container"></div>
      </div>

      <div class="slot" id="slot-3">
        <div class="digit-container"></div>
      </div>

    </div>

    <button id="spinBtn">Quay</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
