<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>production - KidsPlaza Lucky Draw</title>
</head>
<body>
    <div id="app-loader"></div>
    <div id="project-selector-container"></div>
    <div id="table-editor-container"></div>

    <script type="module">
        // -------------------------------
        // Entry points
        // -------------------------------
        import { renderLoadingScreen } from './components/screen-loader-init/screenLoaderInit.main.js';
        import { initProjectSelector } from './components/project-selector/projectSelector.index.js';
        import { renderTableEditor } from './components/table-editor-file/tableEditorFile.index.js';
        import { initTableEditorDedup } from './components/table-editor-dedup/tableEditorDedup.index.js';
        import { initTableEditorEdit } from './components/table-editor-edit/tableEditorEdit.index.js';

        // -------------------------------
        // DOM containers
        // -------------------------------
        const loaderContainer = document.getElementById('app-loader');
        const projectContainer = document.getElementById('project-selector-container');
        const tableContainer = document.getElementById('table-editor-container');

        loaderContainer.style.display = 'block';
        projectContainer.style.display = 'none';
        tableContainer.style.display = 'none';

        // -------------------------------
        // 1️⃣ Loading Screen
        // -------------------------------
        renderLoadingScreen(loaderContainer, () => {
            loaderContainer.style.display = 'none';
            projectContainer.style.display = 'block';

            // -------------------------------
            // 2️⃣ Project Selector
            // -------------------------------
            initProjectSelector(projectContainer, (selectedProject) => {
                projectContainer.style.display = 'none';
                tableContainer.style.display = 'block';

                // -------------------------------
                // 3️⃣ Table Editor
                // -------------------------------
                const initialData = selectedProject.data || [];

                // File handling module
                renderTableEditor({
                    container: tableContainer,
                    projectName: selectedProject.name,
                    data: initialData
                });

                // Dedup module
                const dedupBtn = document.getElementById('dedup-btn');
                const dedupDropdown = document.getElementById('dedup-dropdown');
                const duplicateRows = new Set();
                const dedupColumns = [];
                initTableEditorDedup({
                    dedupBtn,
                    dedupDropdown,
                    data: initialData,
                    dedupColumns,
                    duplicateRows,
                    renderTable: () => renderTableEditor({ container: tableContainer, projectName: selectedProject.name, data: initialData })
                });

                // Edit module
                const editDropdown = document.getElementById('edit-dropdown');
                const saveDraftBtn = document.getElementById('save-draft-btn');
                const saveAllDraftsBtn = document.getElementById('save-all-drafts-btn');
                const discardAllDraftsBtn = document.getElementById('discard-all-drafts-btn');
                const deleteSelectedBtn = document.getElementById('delete-selected-btn');
                const editAllBtn = document.getElementById('edit-all-btn');
                const draftRows = new Set();
                const selectedRows = new Set();
                const originalRows = new Map();

                initTableEditorEdit({
                    editDropdown,
                    saveDraftBtn,
                    saveAllDraftsBtn,
                    discardAllDraftsBtn,
                    deleteSelectedBtn,
                    editAllBtn,
                    data: initialData,
                    draftRows,
                    selectedRows,
                    originalRows,
                    renderTable: () => renderTableEditor({ container: tableContainer, projectName: selectedProject.name, data: initialData })
                });
            });
        });
    </script>
</body>
</html>
