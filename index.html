<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucky Draw Dashboard</title>

    <!-- Global Styles -->
    <link rel="stylesheet" href="styles/global.css">
</head>

<body>

    <!-- Top Navigation Tabs -->
    <div id="menu" class="menu-bar">
        <button data-tab="csv" class="active">CSV Editor</button>
    </div>

    <!-- App container where modules render -->
    <div id="app" class="app-container"></div>

    <!-- Main Script -->
    <script type="module">
        import { renderTableEditor } from './components/TableEditor.js';
        import { loadComponentCSS } from './utils/loadComponentCSS.js';

        const app = document.getElementById('app');
        const buttons = document.querySelectorAll('#menu button');

        let currentModule = null;

        function showModule(moduleName) {
            app.innerHTML = '';
            buttons.forEach(btn => btn.classList.remove('active'));

            document.querySelector(`#menu button[data-tab="${moduleName}"]`)
                    .classList.add('active');

            switch (moduleName) {
                case 'csv':
                    // Load CSS cho TableEditor nếu chưa load
                    loadComponentCSS('styles/dashboard.css');
                    // Render module: toolbar + editor + loader đã gộp
                    currentModule = renderTableEditor(app);
                    break;
                default:
                    app.innerHTML = `<p>Module not implemented yet.</p>`;
            }
        }

        // Load default module
        showModule('csv');

        // Bind tab events
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                showModule(tab);
            });
        });
    </script>

</body>
</html>
